name: CI Pipeline

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

  configure-aws:
    needs: setup
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Set up AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
          role-arn: arn:aws:iam::123456789012:role/AWS_ROLE
          web-identity-token-file: aws-token

  job-A:
    needs: configure-aws
    runs-on: ubuntu-latest
    steps:
      - name: Run job A tasks
        run: echo "Running tasks for job A"

  job-B:
    needs: job-A
    runs-on: ubuntu-latest
    steps:
      - name: Run job B tasks
        run: echo "Running tasks for job B"

  job-C:
    needs: [job-A, job-B]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Run additional tasks
        run: echo "Running additional tasks for job C"

  test:
    runs-on: ubuntu-latest
    name: Run Tests
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing