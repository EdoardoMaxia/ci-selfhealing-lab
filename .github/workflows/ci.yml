name: CI Pipeline

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  A:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: echo "Running tasks for job A"

  B:
    needs: A
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: echo "Running tasks for job B"

  C:
    needs: [A, B]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: echo "Running additional tasks for job C"

  test:
    runs-on: ubuntu-latest
    name: Run Tests
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: |
          pytest tests/ -v --cov=src --cov-report=term-missing