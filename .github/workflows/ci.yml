name: CI Pipeline

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  A:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run job A tasks
        run: echo "Running tasks for job A"
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-A
          path: test-results/

  B:
    needs: A
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run job B tasks
        run: echo "Running tasks for job B"
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-B
          path: test-results/

  C:
    needs: [A, B]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run additional tasks
        run: echo "Running additional tasks for job C"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/
          pattern: test-results-*

  test:
    runs-on: ubuntu-latest
    name: Run Tests
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-test
          path: test-results/